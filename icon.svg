<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>
  <!-- Background with rounded squircles -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Graduation Cap Icon -->
  <g transform="translate(106, 120) scale(0.6)">
    <!-- Cap Diamond -->
    <polygon points="250,50 450,150 250,250 50,150" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="8" />
    <!-- Cap Skull Base -->
    <path d="M110,180 L110,280 C110,340 390,340 390,280 L390,180" fill="#064e3b" stroke="#ffffff" stroke-width="8" opacity="0.9" />
    <!-- Tassel -->
    <path d="M380,185 L420,290" stroke="#fbbf24" stroke-width="12" stroke-linecap="round" />
    <circle cx="425" cy="305" r="16" fill="#fbbf24" />
  </g>

  <!-- Text / Badge -->
  <text x="256" y="375" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3">
    VARTEX
  </text>
  <text x="256" y="425" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="700" fill="#a7f3d0" text-anchor="middle" letter-spacing="1">
    EXAM PORTAL
  </text>
</svg>
